name: Deploy
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-secrets:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Cloudflare secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set"
            missing=1
          else
            echo "CLOUDFLARE_API_TOKEN is set"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set"
            missing=1
          else
            echo "CLOUDFLARE_ACCOUNT_ID is set"
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY is not set"
          else
            echo "STRIPE_SECRET_KEY is set"
          fi
          exit "$missing"

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npx tsc --noEmit
      - name: Resolve D1 database id
        run: node scripts/resolve-d1-id.cjs
      - name: Configure authentication policy
        env:
          REQUIRE_MFA: ${{ vars.REQUIRE_MFA }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: node scripts/configure-worker-security.cjs
      - name: Sync application secrets onto the worker
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          BILLING_EXEMPT_ORG_IDS: ${{ vars.BILLING_EXEMPT_ORG_IDS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          INTEGRATION_CRON_SECRET: ${{ secrets.INTEGRATION_CRON_SECRET }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
          MICROSOFT_CALENDAR_CLIENT_ID: ${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}
          MICROSOFT_CALENDAR_CLIENT_SECRET: ${{ secrets.MICROSOFT_CALENDAR_CLIENT_SECRET }}
          CALENDLY_CLIENT_ID: ${{ secrets.CALENDLY_CLIENT_ID }}
          CALENDLY_CLIENT_SECRET: ${{ secrets.CALENDLY_CLIENT_SECRET }}
          HUBSPOT_CLIENT_ID: ${{ secrets.HUBSPOT_CLIENT_ID }}
          HUBSPOT_CLIENT_SECRET: ${{ secrets.HUBSPOT_CLIENT_SECRET }}
          PIPEDRIVE_CLIENT_ID: ${{ secrets.PIPEDRIVE_CLIENT_ID }}
          PIPEDRIVE_CLIENT_SECRET: ${{ secrets.PIPEDRIVE_CLIENT_SECRET }}
          ATTIO_CLIENT_ID: ${{ secrets.ATTIO_CLIENT_ID }}
          ATTIO_CLIENT_SECRET: ${{ secrets.ATTIO_CLIENT_SECRET }}
          ASANA_CLIENT_ID: ${{ secrets.ASANA_CLIENT_ID }}
          ASANA_CLIENT_SECRET: ${{ secrets.ASANA_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          CLICKUP_CLIENT_ID: ${{ secrets.CLICKUP_CLIENT_ID }}
          CLICKUP_CLIENT_SECRET: ${{ secrets.CLICKUP_CLIENT_SECRET }}
          MONDAY_CLIENT_ID: ${{ secrets.MONDAY_CLIENT_ID }}
          MONDAY_CLIENT_SECRET: ${{ secrets.MONDAY_CLIENT_SECRET }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          TODOIST_CLIENT_ID: ${{ secrets.TODOIST_CLIENT_ID }}
          TODOIST_CLIENT_SECRET: ${{ secrets.TODOIST_CLIENT_SECRET }}
          AIRTABLE_CLIENT_ID: ${{ secrets.AIRTABLE_CLIENT_ID }}
          AIRTABLE_CLIENT_SECRET: ${{ secrets.AIRTABLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          GITLAB_CLIENT_ID: ${{ secrets.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET: ${{ secrets.GITLAB_CLIENT_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: node scripts/sync-worker-secrets.cjs
      - name: Deploy to Cloudflare
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
          INTEGRATION_CRON_SECRET: ${{ secrets.INTEGRATION_CRON_SECRET }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY must be set in GitHub Actions secrets"
            exit 1
          fi
          npm run deploy
      - name: Encrypt legacy D1 secret settings
        env:
          INTEGRATION_ENCRYPTION_KEY: ${{ secrets.INTEGRATION_ENCRYPTION_KEY }}
        run: npx tsx scripts/encrypt-d1-settings.ts
      - name: Verify deployed worker
        env:
          INTEGRATION_CRON_SECRET: ${{ secrets.INTEGRATION_CRON_SECRET }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: node scripts/verify-worker.cjs
      - name: Verify deployed login bundles
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: node scripts/verify-login-assets.cjs
