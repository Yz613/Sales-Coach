name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Detect newly published advisories before the next application change.
  schedule:
    - cron: '17 10 * * *'

concurrency:
  # PRs share a group; every other event keeps its own pending run.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    # Use the available Linux ARM pool and limit parallel provisioning during runner delays.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check dependency advisories
        run: node scripts/ci-audit.cjs

      - name: Run automated tests
        run: npm test

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Verify production build
        run: npm run build
